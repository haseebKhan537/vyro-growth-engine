name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  smoke-dry-run:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      OUTBOUND_ENABLED: "false"
      OPENAI_PERSONALIZATION_ENABLED: "false"
      SMARTLEAD_LIVE_ENABLED: "false"
      OPENAI_REPLY_CLASSIFICATION_ENABLED: "false"
      GOOGLE_CALENDAR_LIVE_ENABLED: "false"
      VOICE_LIVE_ENABLED: "false"
      DECISION_MAKER_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Dry-run smoke gate
        run: |
          set -euo pipefail
          unset DATABASE_URL OPENAI_API_KEY SMARTLEAD_API_KEY GOOGLE_CALENDAR_API_KEY VOICE_API_KEY DECISION_MAKER_API_KEY CONTACT_ENRICHMENT_API_KEY INTERNAL_API_KEY
          vyro-growth smoke-dry-run --local-only --json | tee "${RUNNER_TEMP}/smoke-output.json"
          vyro-growth check-smoke-output --file "${RUNNER_TEMP}/smoke-output.json"

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Confirm safe container defaults
        run: |
          grep -q 'OUTBOUND_ENABLED=false' Dockerfile
          grep -q 'OUTBOUND_ENABLED: "false"' docker-compose.yml
          grep -q 'GOOGLE_CALENDAR_LIVE_ENABLED=false' .env.example
          grep -q 'VOICE_LIVE_ENABLED=false' .env.example
          grep -q 'DECISION_MAKER_LIVE_ENABLED=false' .env.example
          grep -q 'USER appuser' Dockerfile
          test -f .dockerignore
          ! grep -E 'sk-|AIza|BEGIN PRIVATE KEY' .env.example Dockerfile docker-compose.yml
