x-safe-app-env: &safe-app-env
  OUTBOUND_ENABLED: "false"
  OUTBOUND_HALTED: "false"
  OPENAI_PERSONALIZATION_ENABLED: "false"
  SMARTLEAD_LIVE_ENABLED: "false"
  OPENAI_REPLY_CLASSIFICATION_ENABLED: "false"
  GOOGLE_CALENDAR_LIVE_ENABLED: "false"
  VOICE_LIVE_ENABLED: "false"
  DECISION_MAKER_LIVE_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyro
      POSTGRES_PASSWORD: vyro
      POSTGRES_DB: vyro_growth
    ports:
      - "5432:5432"
    volumes:
      - vyro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyro -d vyro_growth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      <<: *safe-app-env
      DATABASE_URL: postgresql+psycopg://vyro:vyro@postgres:5432/vyro_growth
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    profiles: ["ops"]
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *safe-app-env
      DATABASE_URL: postgresql+psycopg://vyro:vyro@postgres:5432/vyro_growth
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["ops"]
    build: .
    command: ["vyro-growth", "worker", "--check"]
    environment:
      <<: *safe-app-env
      DATABASE_URL: postgresql+psycopg://vyro:vyro@postgres:5432/vyro_growth
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vyro_postgres:
